{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Books</h4>
  <div>
    <a class="btn btn-outline-light me-2" href="{{ url_for('add_book') }}">Add Book</a>
  </div>
</div>

<form class="mb-3" method="get" action="{{ url_for('books') }}">
  <div class="input-group">
    <input name="q" value="{{ q }}" class="form-control form-control-dark" placeholder="Search by title...">
    <button class="btn btn-neon">Search</button>
  </div>
</form>

<div class="card dark-card">
  <div class="table-responsive">
    <table class="table table-dark table-borderless align-middle mb-0">
      <thead>
        <tr class="text-muted small">
          <th>Title</th>
          <th>Author</th>
          <th class="text-center">Available</th>
        </tr>
      </thead>
      <tbody>
        {% for book in books %}
        <tr class="row-hover">
          <td>{{ book.title }}</td>
          <td class="text-muted">{{ book.author }}</td>
          <td class="text-center"><span class="badge pill">{{ book.quantity }}</span></td>
        </tr>
        {% else %}
        <tr><td colspan="3">No books found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
