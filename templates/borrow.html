{% extends 'base.html' %}
{% block content %}
<div class="card dark-card p-4">
  <h4>Borrow Book</h4>
  <form method="post" class="mt-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label small text-muted">User</label>
        <select name="user_id" class="form-select form-select-dark" required>
          <option value="">Select user</option>
          {% for u in users %}
          <option value="{{ u.id }}">{{ u.name }} (ID: {{ u.id }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label small text-muted">Book</label>
        <select name="book_id" class="form-select form-select-dark" required>
          <option value="">Select book</option>
          {% for b in books %}
          <option value="{{ b.id }}">{{ b.title }} — Available: {{ b.quantity }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-neon">Borrow</button>
    </div>
  </form>
</div>
{% endblock %}
